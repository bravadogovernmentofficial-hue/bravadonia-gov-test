<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government of Bravadonia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes wave {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }
        .flag { animation: wave 6s infinite ease-in-out; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <div class="max-w-4xl mx-auto px-6 py-16 text-center">
        
        <!-- Flag -->
        <div class="flex justify-center mb-12">
            <img src="https://i.imgur.com/vTAD7zO.png" 
                 alt="Flag of Bravadonia" 
                 class="flag h-64 w-auto shadow-2xl">
        </div>

        <h1 class="text-6xl md:text-7xl font-bold tracking-tighter mb-6">
            GOVERNMENT OF<br>
            <span class="text-red-600">BRAVADONIA</span>
        </h1>

        <p class="text-2xl text-zinc-400 mb-12">Official Test Website</p>

        <div class="inline-flex items-center gap-3 bg-zinc-900 border border-red-900/50 px-8 py-5 rounded-2xl mb-16">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
            <span class="uppercase tracking-widest text-sm text-red-400 font-medium">Test Environment</span>
        </div>

        <footer class="text-zinc-500 text-sm pt-12 border-t border-zinc-800">
            © 2026 Government of Bravadonia • Test Page
        </footer>
    </div>

</body>
</html>
